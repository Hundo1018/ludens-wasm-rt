[workspace]
name = "ludens-wasm-rt"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# The wasm64 toolchain is pinned here. clang / llc / opt / wasm-ld must share a major
# version (mixed majors mis-type call_indirect); node >= 24 for memory64 / table64.
[dependencies]
rattler-build = "*"
python = ">=3.11"
clang = "23.1.4.*"
lld = "23.1.4.*"
llvm-tools = "23.1.4.*"
nodejs = "24.*"
wasmtime-py = ">=50"
mojo-compiler = ">=1.2.0,<1.3"

[pypi-dependencies]
ludens-wasm-rt = { path = ".", editable = true }

[tasks]
selftest = "python3 tests/selftest.py"
# The checks that need clang / wasm-ld / node but no Mojo: what CI runs on every push.
test-cache = "python3 tests/test_object_cache.py"
test-guards = "python3 tests/test_guards.py"
test-runtime-c = "python3 tests/test_runtime_c.py"
test-unit = { depends-on = ["test-guards", "test-cache", "test-runtime-c"] }
check-recipe = "rattler-build build --recipe conda.recipe/recipe.yaml --output-dir build/conda -c conda-forge"
